      <g><rect x="92" y="131" width="118" height="40" rx="10" fill="#0F43CC" stroke="#6E9BFF"/><text x="151" y="156" fill="#FFFFFF">COV-02 · PASS</text></g>
      <g><rect x="92" y="188" width="118" height="40" rx="10" fill="#0F43CC" stroke="#6E9BFF"/><text x="151" y="213" fill="#FFFFFF">COV-03 · PASS</text></g>
      <g><rect x="187" y="42" width="118" height="40" rx="10" fill="#0F43CC" stroke="#6E9BFF"/><text x="246" y="67" fill="#FFFFFF">COV-04 · PASS</text></g>
      <g><rect x="187" y="220" width="118" height="40" rx="10" fill="#0F43CC" stroke="#6E9BFF"/><text x="246" y="245" fill="#FFFFFF">COV-05 · PASS</text></g>
      <g><rect x="510" y="74" width="118" height="40" rx="10" fill="#0F43CC" stroke="#6E9BFF"/><text x="569" y="99" fill="#FFFFFF">COV-06 · PASS</text></g>
      <g><rect x="510" y="131" width="118" height="40" rx="10" fill="#0F43CC" stroke="#6E9BFF"/><text x="569" y="156" fill="#FFFFFF">COV-07 · PASS</text></g>
      <g><rect x="510" y="188" width="118" height="40" rx="10" fill="#0F43CC" stroke="#6E9BFF"/><text x="569" y="213" fill="#FFFFFF">COV-08 · PASS</text></g>
    </g>
