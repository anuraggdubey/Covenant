      <text x="144" y="77" text-anchor="end" class="tile-meta" fill="#6CE9A6">+0.42%</text>
      <path d="M50 114L67 103L84 109L104 88L123 96L144 82" stroke="#4E80EE" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

      <rect x="34" y="156" width="126" height="88" rx="14" fill="#1D2939" stroke="#475467"/>
      <text x="50" y="183" class="tile-title" fill="#FFFFFF">QQQ</text>
      <text x="144" y="183" text-anchor="end" class="tile-meta" fill="#6CE9A6">+0.31%</text>
      <path d="M50 220L68 216L85 201L103 207L122 186L144 192" stroke="#4E80EE" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

