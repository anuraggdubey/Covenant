    <path d="M365 147H430" stroke="#4E80EE" stroke-width="4" stroke-linecap="round"/>
    <path d="M421 137L431 147L421 157" stroke="#4E80EE" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <g filter="url(#tile-shadow)">
      <rect x="449" y="50" width="237" height="194" rx="18" fill="#FFFFFF"/>
      <text x="469" y="79" class="eyebrow" fill="#1652F0">TOP CANDIDATE</text>
      <text x="469" y="115" class="tile-title" fill="#101828">SPY CALL VERTICAL</text>
      <text x="469" y="140" class="tile-meta" fill="#667085">590 / 595 · 14 DTE · QTY 1</text>
      <rect x="469" y="166" width="197" height="50" rx="10" fill="#EEF3FF"/>
      <text x="485" y="187" class="tile-meta" fill="#667085">MAX LOSS</text>
      <text x="485" y="207" class="tile-title" fill="#1652F0">$240.00</text>
