      <text x="198" y="78" class="eyebrow" fill="#98A2B3">OPTION CHAIN</text>
      <path d="M198 103H322M198 131H322M198 159H322M198 187H322M198 215H322" stroke="#475467"/>
      <path d="M239 94V226M280 94V226" stroke="#475467"/>
      <circle cx="219" cy="117" r="5" fill="#6CE9A6"/><circle cx="260" cy="145" r="5" fill="#6CE9A6"/><circle cx="301" cy="173" r="5" fill="#FDB022"/><circle cx="260" cy="201" r="5" fill="#6CE9A6"/>
