    <path d="M274 140H346" stroke="#1652F0" stroke-width="4" stroke-linecap="round"/>
    <path d="M337 130L347 140L337 150" stroke="#1652F0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <g filter="url(#tile-shadow)">
      <rect x="365" y="81" width="104" height="118" rx="18" fill="#EEF3FF" stroke="#1652F0"/>
      <path d="M417 106L447 118V141C447 160 434 174 417 181C400 174 387 160 387 141V118L417 106Z" fill="#1652F0"/>
      <path d="M403 142L413 152L432 130" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="417" y="190" text-anchor="middle" class="tile-meta" fill="#1652F0">VERIFY</text>
