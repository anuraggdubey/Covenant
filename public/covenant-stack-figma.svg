<svg width="1200" height="1150" viewBox="0 0 1200 1150" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="plate-shadow" x="-25%" y="-25%" width="150%" height="170%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="22" stdDeviation="18" flood-color="#0C111D" flood-opacity="0.14"/>
    </filter>
    <filter id="tile-shadow" x="-30%" y="-30%" width="160%" height="180%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#0C111D" flood-opacity="0.16"/>
    </filter>
    <pattern id="grid-dark" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" stroke="#FFFFFF" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <pattern id="grid-blue" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <style>
      .sans { font-family: Inter, Arial, sans-serif; }
      .mono { font-family: "IBM Plex Mono", "SFMono-Regular", Consolas, monospace; }
      .layer-title { font: 700 24px Inter, Arial, sans-serif; letter-spacing: 0.06em; }
      .eyebrow { font: 600 11px "IBM Plex Mono", Consolas, monospace; letter-spacing: 0.12em; }
      .tile-title { font: 700 16px Inter, Arial, sans-serif; }
      .tile-meta { font: 500 10px "IBM Plex Mono", Consolas, monospace; letter-spacing: 0.06em; }
