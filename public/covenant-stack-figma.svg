      <text x="54" y="105" class="tile-title" fill="#101828">SPY 590 / 595</text>
      <text x="54" y="127" class="tile-meta" fill="#667085">CALL VERTICAL · QTY 1</text>
      <path d="M54 154H222M54 178H184M54 202H204" stroke="#D0D5DD" stroke-width="7" stroke-linecap="round"/>
      <circle cx="211" cy="202" r="13" fill="#ECFDF3" stroke="#067647"/>
      <path d="M205 202L209 206L217 197" stroke="#067647" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
