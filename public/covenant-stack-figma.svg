    <path d="M490 140H550" stroke="#1652F0" stroke-width="4" stroke-linecap="round"/>
    <path d="M541 130L551 140L541 150" stroke="#1652F0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

